name: Web CI

on:
  push:
    # infra/ and firebase.json are deployable artifacts, not documentation:
    # database.rules.json is published by the deploy job and firebase.json
    # carries the hosting headers (CSP among them). Leaving them out of this
    # filter meant a rules-only or header-only change pushed to main did not
    # even start a run, so it could never reach production.
    paths:
      - "apps/web/**"
      - "infra/**"
      - "firebase.json"
      - ".github/workflows/web.yml"
  pull_request:
  # Manual trigger: lets us rebuild and redeploy main without a code change —
  # needed when a secret changes, since secrets are only read at build time and
  # GitHub refuses to re-run a workflow run older than ~30 days.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high --omit=dev
      - name: eslint
        working-directory: apps/web
        run: npx eslint src/ --max-warnings=0
      - name: prettier check
        working-directory: apps/web
        run: npx prettier --check "src/**/*.{ts,tsx,css,json}"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: tsc
        working-directory: apps/web
        run: npm run tsc

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: vitest
        working-directory: apps/web
        run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      # The RTDB emulator is a Java process.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: apps/web
      # Security rules are the only place the participant cap is enforced, so
      # they get tested like code rather than reviewed by eye.
      #
      # firebase-tools is invoked here rather than added to devDependencies:
      # it is 23 MB, `npm ci` runs in every job, and only this one needs it.
      # Pinned so a CLI release cannot change what the rules are tested with.
      # Run from the repo root, where firebase.json and infra/ live.
      - name: rules tests (RTDB emulator)
        run: >
          npx -y firebase-tools@15.29.0 emulators:exec
          --only database --project demo-meet-me-halfway
          "npm --prefix apps/web run test:rules"

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, rules]
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: vite build
        working-directory: apps/web
        run: npm run build
        env:
          CI: "true"
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1

  lighthouse:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/
      - name: Lighthouse CI
        working-directory: apps/web
        run: npx @lhci/cli autorun

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox
      - name: Build for E2E
        working-directory: apps/web
        run: npm run build
        env:
          VITE_MAPBOX_TOKEN: "pk.fake_for_e2e"
          VITE_FIREBASE_API_KEY: "fake-key"
          VITE_FIREBASE_AUTH_DOMAIN: "fake.firebaseapp.com"
          VITE_FIREBASE_DATABASE_URL: "https://fake-rtdb.firebaseio.com"
          VITE_FIREBASE_PROJECT_ID: "fake-project"
          VITE_RECAPTCHA_SITE_KEY: "fake-recaptcha"
      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # Deploys BOTH halves of the app: the bundle and the security rules.
  #
  # These must ship together. The client's RTDB schema and database.rules.json
  # are two encodings of one contract, and a change to one without the other
  # takes production down — which is exactly what happened on 2026-09-11, when
  # the slot-schema client deployed here while the matching rules sat in the
  # repo undeployed for three days. Hosting-only deploys are how that skew
  # became possible, so the rules deploy lives in this job rather than in a
  # runbook nobody runs.
  deploy:
    runs-on: ubuntu-latest
    # `rules` gates this job now that the job publishes them: the emulator
    # suite is the only thing standing between a malformed rule and prod.
    needs: [build, lighthouse, e2e, rules]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/
      - name: Strip sourcemaps from dist
        working-directory: apps/web
        run: rm -f dist/assets/*.js.map
      # Hosting first, then rules. A breaking schema change leaves an
      # unavoidable window somewhere; this ordering picks the shorter one.
      # Rules-first would break every already-loaded client the instant the
      # rules land and keep them broken until they pick up a bundle that has
      # not been published yet — the window spans both deploys plus every
      # client's service-worker rollover. Hosting-first only strands clients
      # that fetch the new bundle inside the ~30s gap, and that population is
      # fresh rather than lingering, so it drains as soon as the next step
      # lands. Pinned to match the rules job: a CLI release must not be able
      # to change what gets published.
      - name: Deploy to Firebase Hosting
        run: >
          npx -y firebase-tools@15.29.0 deploy
          --only hosting --project meet-me-halfway-4ae79
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Deploy RTDB security rules
        run: >
          npx -y firebase-tools@15.29.0 deploy
          --only database --project meet-me-halfway-4ae79
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
