version: 2
# One open PR per ecosystem, never one per package.
#
# Every npm update edits the same package-lock.json, so separate PRs
# conflict with each other as soon as one merges. They also hide pairs
# that only install together: firebase 13 and @firebase/rules-unit-testing
# 6 arrived as #101 and #103, and each failed `npm ci` on its own. One
# group carries every update, majors included, so a breaking release is
# fixed in the same PR as the rest of the week's bumps. The cost is that it
# holds them back until it is fixed.
updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are gated on typescript-eslint, not on us.
      # ts-api-utils (pulled in by @typescript-eslint/type-utils) reads
      # compiler internals that the TS 7 Go port does not expose, and
      # @typescript-eslint/*@8.70.0 declares `typescript: ">=4.8.4 <6.1.0"`.
      # A TS 7 bump therefore fails `lint`, not `tsc`. Remove this entry
      # once a typescript-eslint release admits 7.x in that peer range.
      # See #72.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Tracks the Node major CI runs (`node-version` in web.yml). Newer
      # types let APIs that CI's Node lacks typecheck in e2e/ and rules/.
      # Move both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
